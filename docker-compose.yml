services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: mapdrop
      POSTGRES_PASSWORD: mapdrop_dev
      POSTGRES_DB: mapdrop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapdrop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://mapdrop:mapdrop_dev@db:5432/mapdrop
      JWT_SECRET: dev-secret-change-in-production
      FRONTEND_URL: http://localhost:3000
      RUST_LOG: mapdrop_api=debug,tower_http=debug
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
