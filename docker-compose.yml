services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: mapdrop
      POSTGRES_PASSWORD: mapdrop_dev
      POSTGRES_DB: mapdrop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapdrop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
